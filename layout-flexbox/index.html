<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Layout con Flexbox</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <h1>Layout con Flexbox</h1>

  <main class="contenedor">
    <!-- Grupo que contiene A, B y C -->
    <section class="grupo">
      <div class="caja a">A</div>
      <!-- Sub-grupo con B y C (quedan lado a lado en tablet) -->
      <div class="sub-grupo">
        <div class="caja b">B</div>
        <div class="caja c">C</div>
      </div>
    </section>

    <div class="caja d">D</div>
  </main>
</body>
</html>
