<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ejercicio Responsive</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: Arial, sans-serif;
      min-height: 100vh;
      display: grid;
      place-content: center;
      gap: 1rem;
      padding: 1rem;
      background: #f2f2f2;
      text-align: center;
    }
    a {
      display: block;
      padding: 1rem 2rem;
      background: #0040d0;
      color: white;
      text-decoration: none;
      border-radius: 6px;
    }
    a:hover { background: #0091ea; }
  </style>
</head>
<body>
  <h1>Ejercicio Responsive</h1>
  <a href="layout-1/">Layout 1 - Fixture SA</a>
  <a href="layout-2/">Layout 2 - Header / Nav / Article / Aside / Footer</a>
</body>
</html>
